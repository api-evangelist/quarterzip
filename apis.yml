aid: quarterzip
name: Quarterzip
description: >-
  Quarterzip builds AI screenshare agents that deliver real-time, in-product user
  assistance. Its agent sees a user's screen, guides them by voice, and executes the
  steps alongside them in real time, powering onboarding, activation, and customer
  support at scale without additional headcount. Teams embed Quarterzip through a
  hosted Link URL or a client-side JavaScript SDK that launches a draggable in-app
  call (window.Quarterzip.open/close), and receive signed call.completed webhooks
  (Standard Webhooks HMAC) carrying transcripts and call ratings for CRM and
  analytics integration. Customers include Bloomreach, Apollo, Dovetail, Airspeed,
  and Zuper. Quarterzip is ISO 27001 certified.
